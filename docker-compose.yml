services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat_server
    ports:
      - "5433:5432"
    volumes:
      - chat_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat_server"]
      interval: 5s
      timeout: 5s
      retries: 10

  chat-server:
    build: .
    ports:
      - "3002:3002"
    environment:
      RAILS_ENV: development
      PORT: 3002
      CHAT_DATABASE_URL: postgresql://chat:chat@db:5432/chat_server
      CHAT_ADMIN_API_KEY: ${CHAT_ADMIN_API_KEY:-dev-admin-key-change-me}
      CORS_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -lc "bundle exec rake db:migrate &&
      bundle exec puma -C config/puma.rb -b tcp://0.0.0.0:3002"

volumes:
  chat_pg_data:
